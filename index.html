<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIEEE ATBU Student Chapter</title>
<meta name="description" content="Official website of the NIEEE ATBU Student Chapter — Abubakar Tafawa Balewa University, Bauchi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ============================================================
   NIEEE ATBU — All styles
   Navy + Gold professional engineering theme
============================================================ */
:root {
  --navy:       #0a1628;
  --navy-800:   #0f1f38;
  --navy-700:   #162847;
  --navy-600:   #1e3356;
  --navy-500:   #284268;
  --gold:       #c9a84c;
  --gold-light: #e2c06b;
  --gold-dim:   rgba(201,168,76,0.15);
  --gold-glow:  rgba(201,168,76,0.28);
  --white:      #ffffff;
  --text:       #e8edf5;
  --muted:      #8a98b8;
  --border:     rgba(255,255,255,0.08);
  --card:       rgba(22,40,71,0.75);
  --green:      #22c55e;
  --red:        #ef4444;
  --r:          12px;
  --rl:         20px;
  --tr:         0.22s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--text);line-height:1.65;overflow-x:hidden;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 80% 50% at 15% 0%,rgba(201,168,76,0.05) 0%,transparent 60%),
             radial-gradient(ellipse 60% 60% at 85% 100%,rgba(10,22,40,0.9) 0%,transparent 70%)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
ul{list-style:none}
button{cursor:pointer;font-family:inherit}
h1,h2,h3,h4,h5{font-family:'Syne',sans-serif;font-weight:700;line-height:1.18;color:var(--white)}
h1{font-size:clamp(1.8rem,5vw,3rem)}
h2{font-size:clamp(1.4rem,3.5vw,2.1rem)}
h3{font-size:1.15rem}
p{color:var(--muted);line-height:1.75}
.lbl{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:.4rem}
.container{max-width:1140px;margin:0 auto;padding:0 1.25rem}
.section{padding:4.5rem 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.5rem}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.25rem}
.fxb{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem}
.tc{text-align:center}
.w100{width:100%}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
     padding:.7rem 1.5rem;border-radius:10px;font-size:.92rem;font-weight:600;
     border:none;transition:all var(--tr);white-space:nowrap;text-decoration:none;cursor:pointer}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{background:var(--gold-light);box-shadow:0 0 20px var(--gold-glow);transform:translateY(-1px)}
.btn-out{background:transparent;color:var(--gold);border:1.5px solid var(--gold)}
.btn-out:hover{background:var(--gold-dim);transform:translateY(-1px)}
.btn-ghost{background:var(--navy-700);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--navy-500)}
.btn-danger{background:rgba(239,68,68,.15);color:var(--red);border:1.5px solid rgba(239,68,68,.3)}
.btn-success{background:rgba(34,197,94,.12);color:var(--green);border:1.5px solid rgba(34,197,94,.3)}
.btn-sm{padding:.42rem .9rem;font-size:.82rem;border-radius:8px}
.btn-lg{padding:.85rem 2.2rem;font-size:1rem;border-radius:12px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none!important}

/* ── Navbar ── */
.nav{position:sticky;top:0;z-index:100;background:rgba(10,22,40,.93);
     backdrop-filter:blur(18px);border-bottom:1px solid var(--border);
     height:68px;display:flex;align-items:center;padding:0 1.25rem;justify-content:space-between}
.nav-brand{display:flex;align-items:center;gap:.65rem;font-family:'Syne',sans-serif;font-weight:800;font-size:1rem}
.nav-brand img{border:2px solid var(--gold);background:#fff;padding:2px}
.nav-brand .brand-text{line-height:1.2}
.nav-brand .brand-text small{display:block;font-size:.68rem;font-weight:500;color:var(--muted);letter-spacing:.04em}
.nav-links{display:flex;align-items:center;gap:.2rem}
.nav-a{padding:.44rem .88rem;border-radius:8px;font-size:.9rem;font-weight:500;
       color:var(--muted);transition:color var(--tr),background var(--tr);cursor:pointer}
.nav-a:hover,.nav-a.on{color:var(--white);background:var(--navy-700)}
.nav-a.on{color:var(--gold)}
.nav-right{display:flex;align-items:center;gap:.75rem}
.hbg{display:none;flex-direction:column;gap:5px;background:none;border:none;padding:.4rem;cursor:pointer}
.hbg span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px;transition:var(--tr)}
.mob-nav{display:none;position:fixed;top:68px;left:0;right:0;background:var(--navy-800);
         border-bottom:1px solid var(--border);padding:1rem 1.25rem;z-index:99;flex-direction:column;gap:.25rem}
.mob-nav.open{display:flex}
.mob-a{padding:.78rem 1rem;border-radius:8px;color:var(--muted);font-weight:500;cursor:pointer;transition:all var(--tr)}
.mob-a:hover,.mob-a.on{background:var(--navy-700);color:var(--gold)}

/* ── Footer ── */
.footer{background:var(--navy-800);border-top:1px solid var(--border);padding:3.5rem 1.25rem 2rem;margin-top:5rem}
.footer-grid{display:grid;grid-template-columns:1.6fr repeat(3,1fr);gap:2.5rem}
.footer-brand p{color:var(--muted);font-size:.88rem;margin-top:.75rem;max-width:280px;line-height:1.7}
.fcol h4{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:1rem;color:var(--gold)}
.fcol a{display:block;color:var(--muted);font-size:.9rem;margin-bottom:.55rem;transition:color var(--tr);cursor:pointer}
.fcol a:hover{color:var(--gold)}
.footer-bottom{margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--border);
               display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;
               color:var(--muted);font-size:.83rem}
.socials{display:flex;gap:.65rem}
.soc{width:34px;height:34px;border-radius:8px;background:var(--navy-700);border:1px solid var(--border);
     display:flex;align-items:center;justify-content:center;font-size:.88rem;
     transition:all var(--tr);cursor:pointer;text-decoration:none}
.soc:hover{background:var(--gold-dim);border-color:var(--gold)}

/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);
      backdrop-filter:blur(8px);overflow:hidden;
      transition:border-color var(--tr),box-shadow var(--tr),transform var(--tr)}
.card:hover{border-color:rgba(201,168,76,.25);box-shadow:0 8px 32px rgba(0,0,0,.3);transform:translateY(-3px)}
.cb{padding:1.5rem}
.cimg{width:100%;height:185px;background:var(--navy-600);display:flex;align-items:center;
      justify-content:center;font-size:3.5rem;overflow:hidden}
.cimg img{width:100%;height:100%;object-fit:cover}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.22rem .7rem;
       border-radius:20px;font-size:.72rem;font-weight:700;letter-spacing:.04em}
.bg-gold{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(201,168,76,.3)}
.bg-green{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.25)}
.bg-blue{background:rgba(56,189,248,.1);color:#38bdf8;border:1px solid rgba(56,189,248,.25)}
.bg-red{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.25)}

/* ── Forms ── */
.fg{margin-bottom:1.2rem}
.fl{display:block;font-size:.83rem;font-weight:600;color:var(--muted);margin-bottom:.42rem}
.fc{width:100%;padding:.75rem 1rem;background:var(--navy-700);border:1.5px solid var(--border);
    border-radius:10px;color:var(--text);font-size:.95rem;outline:none;font-family:inherit;
    transition:border-color var(--tr),box-shadow var(--tr)}
.fc::placeholder{color:var(--muted)}
.fc:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim)}
.fc.err{border-color:var(--red)}
textarea.fc{resize:vertical;min-height:110px}
select.fc{cursor:pointer}
select.fc option{background:var(--navy-700)}
.fe{display:none;font-size:.8rem;color:var(--red);margin-top:.3rem}
.fe.show{display:block}
.irow{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

/* ── Hero ── */
.hero{padding:5rem 1.25rem 4rem;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);
  width:700px;height:700px;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse,rgba(201,168,76,.07) 0%,transparent 70%)}
.hero-logos{display:flex;align-items:center;justify-content:center;gap:2rem;
            margin-bottom:2rem;flex-wrap:wrap}
.hero-logo-wrap{text-align:center}
.hero-logo-wrap img{width:100px;height:100px;border-radius:50%;object-fit:cover;
  border:3px solid var(--gold);box-shadow:0 0 28px var(--gold-glow);
  background:#fff;padding:4px;margin:0 auto}
.hero-logo-wrap span{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);margin-top:.4rem;font-weight:700}
.hero-sep{color:var(--muted);font-size:1.4rem;opacity:.6}
.hero-eye{display:inline-flex;align-items:center;gap:.5rem;background:var(--gold-dim);
  border:1px solid rgba(201,168,76,.3);border-radius:20px;padding:.32rem 1rem;
  font-size:.76rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);margin-bottom:1.5rem}
.hero h1{max-width:760px;margin:0 auto 1.2rem}
.hero h1 .hl{color:var(--gold)}
.hero>p{max-width:550px;margin:0 auto 2.5rem;font-size:1.05rem}
.hero-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.hstats{display:flex;justify-content:center;margin:3.5rem auto 0;max-width:520px;
        border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--card)}
.hstat{flex:1;padding:1.4rem 1rem;text-align:center;border-right:1px solid var(--border)}
.hstat:last-child{border-right:none}
.hstat-n{font-family:'Syne',sans-serif;font-size:1.85rem;font-weight:800;color:var(--gold)}
.hstat-l{font-size:.8rem;color:var(--muted);margin-top:.2rem}

/* ── Page header ── */
.ph{padding:2.5rem 0 2rem;border-bottom:1px solid var(--border);margin-bottom:2.5rem}

/* ── Team cards ── */
.team-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);
           text-align:center;padding:2rem 1.25rem 1.5rem;transition:all var(--tr)}
.team-card:hover{border-color:rgba(201,168,76,.3);transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,.3)}
.tphoto{width:96px;height:96px;border-radius:50%;border:3px solid var(--gold);
        background:var(--navy-500);display:flex;align-items:center;justify-content:center;
        font-size:2rem;margin:0 auto 1rem;overflow:hidden}
.tphoto img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.tname{font-weight:700;color:var(--white);margin-bottom:.2rem}
.tpos{font-size:.82rem;color:var(--gold);font-weight:600;margin-bottom:.7rem}
.tbio{font-size:.84rem;color:var(--muted);line-height:1.6}

/* ── Announce card ── */
.acard{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);
       padding:1.5rem;transition:all var(--tr)}
.acard:hover{border-color:rgba(201,168,76,.2);transform:translateY(-2px)}
.acard h3{color:var(--white);font-size:1.05rem;margin-bottom:.5rem}
.acard .meta{font-size:.76rem;color:var(--muted);margin-top:.7rem;display:flex;gap:.7rem;flex-wrap:wrap}

/* ── Spinner ── */
.spin{display:inline-block;width:30px;height:30px;border:3px solid var(--border);
      border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;flex-direction:column;align-items:center;gap:1rem;padding:3rem;color:var(--muted)}
.empty{text-align:center;padding:3rem;color:var(--muted)}
.empty-ico{font-size:3rem;margin-bottom:.75rem}

/* ── Toast ── */
.toast-wrap{position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;
            display:flex;flex-direction:column;gap:.7rem}
.toast{display:flex;align-items:center;gap:.75rem;padding:.85rem 1.25rem;
       background:var(--navy-800);border:1px solid var(--border);border-radius:12px;
       box-shadow:0 4px 24px rgba(0,0,0,.45);min-width:250px;
       animation:tin .3s ease}
.toast.success{border-left:3px solid var(--green)}
.toast.error{border-left:3px solid var(--red)}
.toast.info{border-left:3px solid var(--gold)}
@keyframes tin{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{from{transform:none;opacity:1}to{transform:translateX(120%);opacity:0}}

/* ── Modal ── */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);
     z-index:200;display:none;align-items:center;justify-content:center;padding:1rem}
.mbg.open{display:flex}
.modal{background:var(--navy-800);border:1px solid var(--border);border-radius:var(--rl);
       width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.mh{padding:1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mb{padding:1.5rem}
.mf{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.75rem}
.mcl{background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;padding:.25rem}
.mcl:hover{color:var(--red)}

/* ── Admin layout ── */
.admin-shell{display:flex;min-height:calc(100vh - 68px)}
.aside{width:240px;flex-shrink:0;background:var(--navy-800);border-right:1px solid var(--border);padding:1.5rem 0}
.aside-a{display:flex;align-items:center;gap:.75rem;padding:.72rem 1.5rem;color:var(--muted);
         font-size:.9rem;font-weight:500;cursor:pointer;transition:all var(--tr);
         border:none;background:none;width:100%;text-align:left}
.aside-a:hover,.aside-a.on{background:var(--navy-700);color:var(--text)}
.aside-a.on{border-left:3px solid var(--gold);color:var(--gold)}
.acontent{flex:1;padding:2.5rem;overflow-y:auto}
.asec{display:none}
.asec.on{display:block}

/* ── Table ── */
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
thead{background:var(--navy-700)}
th{padding:.82rem 1.2rem;font-size:.76rem;font-weight:700;letter-spacing:.08em;
   text-transform:uppercase;color:var(--muted);text-align:left;white-space:nowrap}
td{padding:.95rem 1.2rem;font-size:.9rem;border-top:1px solid var(--border);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.02)}

/* ── Section header ── */
.sh{text-align:center;margin-bottom:3rem}
.sh h2{margin-top:.3rem}
.sh p{max-width:540px;margin:.7rem auto 0}

/* ── Responsive ── */
@media(max-width:900px){
  .footer-grid{grid-template-columns:1fr 1fr}
  .aside{width:56px}
  .aside-a .albl{display:none}
  .aside-a{justify-content:center;padding:.9rem}
}
@media(max-width:700px){
  .nav-links,.nav-right .btn{display:none}
  .hbg{display:flex}
  .hero{padding:3.5rem 1.25rem 2.5rem}
  .hero-logo-wrap img{width:80px;height:80px}
  .hstats{flex-direction:column}
  .hstat{border-right:none;border-bottom:1px solid var(--border)}
  .hstat:last-child{border-bottom:none}
  .footer-grid{grid-template-columns:1fr}
  .irow{grid-template-columns:1fr}
  .toast-wrap{left:1rem;right:1rem}
  .toast{min-width:0}
}
@media(max-width:480px){.btn-lg{width:100%}.aside{display:none}.acontent{padding:1.25rem}}
</style>
</head>
